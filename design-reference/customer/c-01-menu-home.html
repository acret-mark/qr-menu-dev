<!-- Item-detail sheet — one shared template, populated from whichever
     .item-card is clicked. Replaces the old inline accordion this page
     never actually wired up interactively (specs/026-menu-home-rebrand

  <div class="item-sheet" id="item-sheet" role="dialog" aria-modal="true">

    </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="7" width="12" height="10" rx="4"/></svg>
        <div class="sold-out-banner" id="item-sheet-sold-out" hidden><span>Sold Out</span></div>
      </div>
      <div class="item-sheet-content">
        <div class="item-sheet-price" id="item-sheet-price"></div>
        <div class="item-sheet-name">
          <span id="item-sheet-name"></span>
          <span class="best-seller-star" id="item-sheet-star" hidden>★</span>
        </div>
        <p class="item-sheet-desc" id="item-sheet-desc"></p>
        <div class="item-sheet-tags">

        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var tabs = document.querySelectorAll(".category-tab");
  var panels = document.querySelectorAll("[data-category-panel]");
  tabs.forEach(function (tab) {
    tab.addEventListener("click", function () {
      var category = tab.getAttribute("data-category");
      tabs.forEach(function (t) { t.classList.toggle("active", t === tab); });
      panels.forEach(function (p) {
        p.hidden = p.getAttribute("data-category-panel") !== category;
      });
    });
  });

  // Demo only — the real component derives the initial selection from
  // Accept-Language/navigator.language and persists an override for the
  // session (cookie/localStorage), it doesn't just toggle a menu open/closed.
  (function () {
    var btn = document.getElementById("lang-selector-btn");
    var menu = document.getElementById("lang-selector-menu");
    var current = document.getElementById("lang-selector-current");
    btn.addEventListener("click", function () {
      menu.hidden = !menu.hidden;
      btn.setAttribute("aria-expanded", String(!menu.hidden));
    });
    menu.querySelectorAll("button").forEach(function (opt) {
      opt.addEventListener("click", function () {
        menu.querySelectorAll("button").forEach(function (o) { o.classList.toggle("active", o === opt); });
        current.textContent = opt.getAttribute("data-lang").toUpperCase();
        menu.hidden = true;
        btn.setAttribute("aria-expanded", "false");
      });
    });
  })();

  // Item-detail sheet — slides up over a dimmed backdrop (specs/026-menu-
  // home-rebrand follow-up), populated from whichever .item-card's data-*
  // attributes were clicked. Mirrors ItemDetailSheet.tsx's own behavior:
  // only the open transition animates (a frame delay before adding "open"
  // lets the browser paint the closed position first); closing is an
  // immediate hide, not a reverse slide.
  (function () {
    var overlay = document.getElementById("item-sheet-overlay");
    var backdrop = document.getElementById("item-sheet-backdrop");
    var closeBtn = document.getElementById("item-sheet-close");
    var priceEl = document.getElementById("item-sheet-price");
    var nameEl = document.getElementById("item-sheet-name");
    var starEl = document.getElementById("item-sheet-star");
    var descEl = document.getElementById("item-sheet-desc");
    var categoryEl = document.getElementById("item-sheet-category");
    var soldOutEl = document.getElementById("item-sheet-sold-out");

    document.querySelectorAll(".item-card").forEach(function (card) {
      card.addEventListener("click", function () {
        priceEl.textContent = "₱" + card.getAttribute("data-price");
        nameEl.textContent = card.getAttribute("data-name");
        descEl.textContent = card.getAttribute("data-desc");
        categoryEl.textContent = card.getAttribute("data-category-name");
        starEl.hidden = card.getAttribute("data-best-seller") !== "true";
        soldOutEl.hidden = card.getAttribute("data-sold-out") !== "true";

        overlay.hidden = false;
        // Force a layout flush before adding "open" so the slide-up
        // transition actually plays instead of snapping straight open.
        // setTimeout, not requestAnimationFrame — rAF is fully suspended by
        // the browser whenever document.visibilityState is "hidden" (a
        // backgrounded/non-visible tab), which setTimeout isn't subject to.
        overlay.offsetHeight;
        setTimeout(function () {
          overlay.classList.add("open");
        }, 20);
      });
    });

    // Plays the slide-down in reverse before actually hiding — mirrors
    // ItemDetailSheet.tsx's own handleClose (the 300ms here must match
    // .item-sheet's own transition-duration in reference.css).
    function closeSheet() {
      overlay.classList.remove("open");
      setTimeout(function () {
        overlay.hidden = true;
      }, 300);
    }
    backdrop.addEventListener("click", closeSheet);
    closeBtn.addEventListener("click", closeSheet);
    window.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !overlay.hidden) closeSheet();
    });
  })();
</script>
